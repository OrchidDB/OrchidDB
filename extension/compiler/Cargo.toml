[package]
name = "orchid-duckdb-compiler"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
quickwit = ["orchiddb/quickwit"]
elasticsearch = ["orchiddb/elasticsearch"]
prometheus = ["orchiddb/prometheus"]
loki = ["orchiddb/loki"]
weaviate = ["orchiddb/weaviate"]
default = ["orchid-catalog", "quickwit", "elasticsearch", "weaviate", "prometheus", "loki"]
orchid-catalog = ["orchiddb/orchid-catalog"]

[dependencies]
arrow = { version = "58.2.0", default-features = false, features = ["ffi"] }
stacker = "0.1.24"
orchiddb = { path = "../..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = { version = "=0.61.0", default-features = false, features = ["std", "visitor"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
futures = "0.3"
async-trait = "0.1"

