[package]
name = "orchid-duckdb-compiler"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[workspace]

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
arrow = { version = "58.2.0", default-features = false, features = ["ffi"] }
stacker = "0.1.24"
orchiddb = { path = "../..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = { version = "=0.61.0", default-features = false, features = ["std", "visitor"] }
tokio = { version = "1", features = ["rt"] }

[profile.dev]
debug = 0

[profile.release]
debug = 0
