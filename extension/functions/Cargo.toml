[package]
name = "orchiddb-duckdb-functions"
version = "0.5.2"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
orchiddb = { path = "../..", default-features = false }
arrow = { version = "58.2.0", default-features = false, features = ["ffi"] }
serde_json = "1"
stacker = "0.1"
