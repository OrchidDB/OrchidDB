[package]
name = "orchiddb-conformance-runner"
version = "0.1.0"
edition = "2024"

[dependencies]
orchiddb = { path = "../..", features = ["duckdb", "trino", "weaviate", "quickwit", "prometheus", "loki", "elasticsearch", "orchid-catalog"] }
arrow = { version = "58.2.0", default-features = false, features = ["ipc"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
datafusion = { package = "orchid-datafusion-compiler", path = "../../compiler/datafusion" }
duckdb = { version = "1.10502.0", path = "../../vendor/duckdb", features = ["chrono", "vtab-arrow"] }

[[bin]]
name = "orchiddb-jvm-store"
path = "../../src/bin/orchiddb-jvm-store.rs"

[workspace]
resolver = "2"

[patch.crates-io]
duckdb = { path = "../../vendor/duckdb" }
datafusion-functions = { path = "../../vendor/datafusion-functions" }
datafusion-functions-aggregate = { path = "../../vendor/datafusion-functions-aggregate" }
datafusion-functions-nested = { path = "../../vendor/datafusion-functions-nested" }
datafusion-sql = { path = "../../vendor/datafusion-sql" }
libduckdb-sys = { path = "../../vendor/libduckdb-sys" }
