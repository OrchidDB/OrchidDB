[package]
name = "orchiddb-conformance-runner"
version = "0.1.0"
edition = "2024"

[dependencies]
orchiddb = { path = "../..", features = ["duckdb", "postgres"] }
postgres = "0.19"
arrow = "58.2.0"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
datafusion = "53.1.0"
duckdb = { version = "1.10502.0", features = ["chrono", "vtab-arrow"] }

[[bin]]
name = "orchiddb-jvm-store"
path = "../../src/bin/orchiddb-jvm-store.rs"

[workspace]
resolver = "2"
