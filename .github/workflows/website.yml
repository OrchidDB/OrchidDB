name: Publish static websites

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'website/**'
      - 'conformance/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: websites-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate documentation
        run: |
          python3 website/docs/build.py
          python3 website/docs/check.py
          node --check website/docs/assets/docs.js
          node --check website/docs/assets/conformance.js
          node --check website/script.js
          bash -n website/scripts/deploy.sh
      - uses: actions/upload-artifact@v4
        with:
          name: static-documentation
          path: website/docs/dist/
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: websites
      url: https://docs.crabgraph.net/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate with personal AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.CRABGRAPH_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CRABGRAPH_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Publish landing page and documentation
        run: bash website/scripts/deploy.sh
      - name: Record published sites
        run: |
          echo 'Published https://crabgraph.net/ and https://docs.crabgraph.net/' >> "$GITHUB_STEP_SUMMARY"
