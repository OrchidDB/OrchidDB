name: Rust checks
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --lib --bins
      - name: Engine and relational integration
        # Deep DataFusion SQL unparsing in debug builds needs a larger test
        # thread stack. Keep the limit explicit until plan depth is reduced.
        env:
          RUST_MIN_STACK: "16777216"
        run: >-
          cargo test --locked
          --test engine --test engine_adversarial --test duckdb_session
          --test engine_incremental --test engine_storage_integrity
          --test mapped_updates --test mapped_update_edges
          --test mapped_engine --test cypher_parameters --test cypher_dml
          --test rel_mutation_visibility --test byos_smoke
          --test sql_backend_smoke --test exec_islands --test sparql_smoke
          --test repeat_semantics --test recursion_limits --test wide_integer_predicates
          --test distinct_semantics
          --test gremlin_planner --test cypher_parser_lowering --test planner_integration
          --test hep_optimization --test recursive_cte_support --test rel_backend_smoke
      - run: cargo check --locked --no-default-features --lib
