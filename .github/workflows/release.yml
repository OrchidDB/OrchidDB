name: Prepare Rust release
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or existing v0.1.0 tag to verify
        type: string
        default: main
        required: true
      publish:
        description: Publish to crates.io (requires an existing matching version tag)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: rust-release-${{ inputs.ref }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  RUST_MIN_STACK: '16777216'
jobs:
  package:
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source and publish intent
        id: source
        env:
          RELEASE_REF: ${{ inputs.ref }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python - <<'PYTHON'
          import os, subprocess, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if os.environ['PUBLISH'] == 'true':
              tag = 'v' + version
              if os.environ['RELEASE_REF'] != tag:
                  raise SystemExit('Publishing requires ref=' + tag)
              tagged = subprocess.check_output(['git', 'rev-parse', 'refs/tags/' + tag + '^{commit}'], text=True).strip()
              if tagged != commit:
                  raise SystemExit('Tag does not match the checked-out commit')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('commit=' + commit + '\nversion=' + version + '\n')
          PYTHON
      - name: Build registry packages without publishing
        run: python scripts/release/package-workspace.py --core . --output dist
      - name: Record artifact provenance
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          printf '%s\n' "$SOURCE_COMMIT" > dist/SOURCE_COMMIT
          cd dist
          sha256sum ./*.crate SOURCE_COMMIT > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: verified-crates
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  publish:
    if: ${{ inputs.publish }}
    needs: package
    runs-on: ubuntu-22.04
    environment: crates-io
    steps:
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: actions/download-artifact@v4
        with:
          name: verified-crates
          path: dist
      - name: Publish the verified orchiddb archive
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.package.outputs.version }}
          SOURCE_COMMIT: ${{ needs.package.outputs.commit }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          cd dist
          sha256sum -c SHA256SUMS
          test "$(cat SOURCE_COMMIT)" = "$SOURCE_COMMIT"
          tar -xzf "orchiddb-$VERSION.crate"
          cargo publish --locked --manifest-path "orchiddb-$VERSION/Cargo.toml"
