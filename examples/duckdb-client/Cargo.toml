[package]
name = "orchiddb-duckdb-client-example"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["bundled"]
bundled = ["duckdb/bundled"]

[dependencies]
orchiddb = { path = "../.." }
# This is the application's driver, not an OrchidDB compiler dependency.
duckdb = "1.10502.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
