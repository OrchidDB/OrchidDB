[package]
name = "orchiddb-java-native"
version = "0.4.0"
edition = "2024"
publish = false

[lib]
name = "orchiddb_java"
crate-type = ["cdylib"]

[dependencies]
orchiddb = { path = "../../..", default-features = false }
jni = "0.21.1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[features]
weaviate = ["orchiddb/weaviate"]
orchid-catalog = ["orchiddb/orchid-catalog"]
default = ["quickwit", "elasticsearch", "weaviate", "orchid-catalog"]
quickwit = ["orchiddb/quickwit"]
elasticsearch = ["orchiddb/elasticsearch"]
