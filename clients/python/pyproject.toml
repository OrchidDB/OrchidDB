[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "orchiddb"
version = "0.3.0"
description = "OrchidDB graph-to-SQL compiler and caller-owned Arrow execution"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE.md"]
readme = "README.md"
[project.optional-dependencies]
arrow = ["pyarrow>=18"]
postgres = ["psycopg[binary]>=3", "pyarrow>=18"]
test = ["pytest>=8", "duckdb>=1.5", "pyarrow>=18", "numpy>=2"]
[tool.setuptools.package-data]
orchiddb = ["native/*", "CORE_REVISION"]

[tool.pytest.ini_options]
testpaths = ["tests"]
