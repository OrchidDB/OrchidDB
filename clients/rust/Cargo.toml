[package]
name = "orchiddb-client"
version = "0.4.2"
edition = "2024"
description = "Caller-owned Arrow execution for OrchidDB graph queries"
license = "GPL-3.0-only"
repository = "https://github.com/OrchidDB/OrchidDB"
publish = false
include = ["src/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE.md"]

[dependencies]
thiserror = "2"
orchiddb = { version = "=0.4.2", path = "../..", default-features = false }
arrow = "58.2.0"
serde_json = "1"

[features]
weaviate = ["orchiddb/weaviate"]
default = []
orchid-catalog = ["orchiddb/orchid-catalog"]
quickwit = ["orchiddb/quickwit"]
elasticsearch = ["orchiddb/elasticsearch"]
kafka = ["orchiddb/kafka"]
duckdb = ["orchiddb/duckdb"]
bundled-test-driver = ["duckdb/bundled"]

[dev-dependencies]
async-trait = "0.1"
duckdb = "=1.10502.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
