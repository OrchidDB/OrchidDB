[package]
name = "orchiddb-workspace-integration"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["bundled"]
bundled = ["duckdb/bundled"]

[dev-dependencies]
orchiddb = { path = "../../.." }
duckdb = "=1.10502.0"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace]
