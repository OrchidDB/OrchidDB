[package]
name = "orchiddb"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = ["crates-io"]
description = "An embedded graph query engine written in Rust"
repository = "https://github.com/OrchidDB/OrchidDB"
homepage = "https://orchiddb.com"
documentation = "https://docs.orchiddb.com"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE.md"]

[workspace]
members = []
resolver = "2"

[[bin]]
name = "orchiddb"
path = "src/bin/orchiddb.rs"
required-features = ["duckdb"]

[[bin]]
name = "orchiddb-jvm-store"
path = "src/bin/orchiddb-jvm-store.rs"

[features]
default = []
# Optional syntax extensions of the embedded SPARQL parser.
sep-0002 = []
sep-0006 = []
sparql-12 = ["oxrdf/rdf-12"]
standard-unicode-escaping = []
duckdb = ["dep:duckdb"]
postgres = ["dep:postgres"]

[dependencies]
chrono = "0.4.44"
chrono-tz = "0.10.4"
async-trait = "0.1"
futures = "0.3"
antlr4rust = "0.5.2"
stacker = "0.1.24"
arrow = { version = "58.2.0", default-features = false, features = ["ipc"] }
arrow-select = "58.2.0"
bigdecimal = "0.4"
# SQL compilation and in-memory execution do not need DataFusion file readers.
datafusion = { version = "53.1.0", default-features = false, features = [
    "nested_expressions", "crypto_expressions", "datetime_expressions",
    "encoding_expressions", "regex_expressions", "string_expressions",
    "unicode_expressions", "recursive_protection", "sql",
] }
datafusion-sql = "53.1.0"
duckdb = { version = "1.10502.0", features = ["bundled", "chrono", "vtab-arrow", "vscalar", "vscalar-arrow"], optional = true }
md-5 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
oxiri = "0.2"
oxsdatatypes = "0.2.2"
postgres = { version = "0.19", optional = true }
regex = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
oxilangtag = "0.1"
oxrdf = "=0.3.4"
peg = "0.8"
rand = "0.9"
thiserror = "2"
unicode-segmentation = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
parquet = { version = "58.2.0", features = ["arrow"] }

[[example]]
name = "managed_graph"
required-features = ["duckdb"]
