[package]
name = "orchiddb"
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
autobins = false
description = "Multi-engine graph language compiler, runtime, and optional DuckDB extension"
repository = "https://github.com/OrchidDB/OrchidDB"
homepage = "https://orchiddb.com"
documentation = "https://github.com/OrchidDB/OrchidDB#readme"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE.md"]

[workspace]
members = ["clients/rust", "clients/native", "clients/java/native", "cli", "extension/compiler"]
default-members = ["."]
exclude = ["clients/rust/examples"]
resolver = "2"

[[bin]]
name = "orchiddb-jvm-store"
path = "src/bin/orchiddb-jvm-store.rs"

[features]
default = []
# Optional syntax extensions of the embedded SPARQL parser.
sep-0002 = []
sep-0006 = []
sparql-12 = ["oxrdf/rdf-12"]
standard-unicode-escaping = []
duckdb = ["dep:duckdb"]
postgres = ["dep:postgres"]
weaviate = ["dep:reqwest"]
quickwit = ["dep:reqwest"]
elasticsearch = ["dep:reqwest"]
orchid-catalog = ["dep:reqwest"]

[dependencies]
toml = "0.9.12"
chrono = "0.4.44"
chrono-tz = "0.10.4"
async-trait = "0.1"
futures = "0.3"
antlr4rust = "0.5.2"
stacker = "0.1.24"
arrow = { version = "58.2.0", default-features = false, features = ["ipc"] }
arrow-json = "58.2.0"
arrow-select = "58.2.0"
bigdecimal = "0.4"
# SQL compilation and in-memory execution do not need DataFusion file readers.
datafusion = { version = "53.1.0", default-features = false, features = [
    "nested_expressions", "crypto_expressions", "datetime_expressions",
    "encoding_expressions", "regex_expressions", "string_expressions",
    "unicode_expressions", "recursive_protection", "sql",
] }
datafusion-sql = "53.1.0"
duckdb = { version = "1.10502.0", features = ["chrono", "vtab-arrow", "vscalar", "vscalar-arrow"], optional = true }
md-5 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
oxiri = "0.2"
oxsdatatypes = "0.2.2"
postgres = { version = "0.19", optional = true, features = ["with-chrono-0_4"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
jsonschema = { version = "0.33", default-features = false }
oxilangtag = "0.1"
oxrdf = "=0.3.4"
peg = "0.8"
rand = "0.9"
thiserror = "2"
unicode-segmentation = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
parquet = { version = "58.2.0", features = ["arrow"] }

[[example]]
name = "collection_table_plans"
path = "tools/diagnostics/collection_table_plans.rs"

[[example]]
name = "cypher_corpus_probe"
path = "tools/diagnostics/cypher_corpus_probe.rs"

[[example]]
name = "cypher_dbg"
path = "tools/diagnostics/cypher_dbg.rs"

[[example]]
name = "language_functions_bench"
path = "tools/diagnostics/language_functions_bench.rs"
required-features = ["duckdb"]

[[example]]
name = "dependent_execution_bench"
path = "tools/diagnostics/dependent_execution_bench.rs"
required-features = ["duckdb"]

[[example]]
name = "mapped_execution_plans"
path = "tools/diagnostics/mapped_execution_plans.rs"

[[example]]
name = "partition_layout_plans"
path = "tools/diagnostics/partition_layout_plans.rs"

[[example]]
name = "representation_plans"
path = "tools/diagnostics/representation_plans.rs"

[[example]]
name = "sparql_coverage"
path = "tools/diagnostics/sparql_coverage.rs"

[[example]]
name = "statistics_access_plans"
path = "tools/diagnostics/statistics_access_plans.rs"

[[example]]
name = "statistics_join_plans"
path = "tools/diagnostics/statistics_join_plans.rs"

[[example]]
name = "statistics_plans"
path = "tools/diagnostics/statistics_plans.rs"

[profile.release]
strip = "symbols"
