[package]
name = "orchiddb"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "An embedded graph query engine written in Rust"
repository = "https://github.com/OrchidDB/OrchidDB"
homepage = "https://orchiddb.com"
documentation = "https://docs.orchiddb.com"

[[bin]]
name = "orchiddb"
path = "src/bin/orchiddb.rs"
required-features = ["duckdb"]

[[bin]]
name = "orchiddb-jvm-store"
path = "src/bin/orchiddb-jvm-store.rs"

[features]
default = []
duckdb = ["dep:duckdb"]
postgres = ["dep:postgres"]

[dependencies]
chrono = "0.4.44"
chrono-tz = "0.10.4"
async-trait = "0.1"
futures = "0.3"
antlr4rust = "0.5.2"
stacker = "0.1.24"
arrow = "58.2.0"
arrow-select = "58.2.0"
bigdecimal = "0.4"
datafusion = "53.1.0"
datafusion-sql = "53.1.0"
duckdb = { version = "1.10502.0", features = ["bundled", "chrono", "vtab-arrow", "vscalar", "vscalar-arrow"], optional = true }
md-5 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
oxiri = "0.2"
oxsdatatypes = "0.2.2"
postgres = { version = "0.19", optional = true }
regex = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
spargebra = { version = "0.4.7", path = "vendor/spargebra" }
thiserror = "2"
unicode-segmentation = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
parquet = { version = "58.2.0", features = ["arrow"] }

[[example]]
name = "managed_graph"
required-features = ["duckdb"]
