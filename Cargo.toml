[package]
name = "orchiddb"
version = "0.5.1"
edition = "2024"
license = "GPL-3.0-only"
publish = false
autobins = false
description = "Cypher query lowering and Arrow execution on caller-owned SQL sources"
repository = "https://github.com/OrchidDB/OrchidDB"
homepage = "https://orchiddb.com"
documentation = "https://github.com/OrchidDB/OrchidDB#readme"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE.md"]

[workspace]
members = ["clients/rust", "clients/native", "extension/functions", "compiler/datafusion"]
default-members = ["."]
exclude = ["clients/rust/examples", "tools/diagnostics/streaming-prototypes/duckdb-arrow-stream-demo", "tools/diagnostics/streaming-prototypes/trino-arrow-stream-demo", "vendor/duckdb", "vendor/libduckdb-sys", "vendor/datafusion-functions", "vendor/datafusion-functions-aggregate", "vendor/datafusion-functions-nested", "vendor/datafusion-sql"]
resolver = "2"

[features]
default = []
duckdb = ["dep:duckdb"]
duckdb-download = ["duckdb", "duckdb/download"]
trino = ["dep:reqwest"]
orchid-catalog = ["dep:reqwest"]
kafka = ["dep:rdkafka"]

[dependencies]
toml = "0.9.12"
chrono = "0.4.44"
chrono-tz = "0.10.4"
async-trait = "0.1"
futures = "0.3"
antlr4rust = "0.5.2"
stacker = "0.1.24"
arrow = { version = "58.2.0", default-features = false, features = ["ipc"] }
arrow-json = "58.2.0"
arrow-select = "58.2.0"
bigdecimal = "0.4"
# Internal composition of DataFusion logical compiler components, without its executor.
datafusion = { package = "orchid-datafusion-compiler", path = "compiler/datafusion" }
duckdb = { version = "1.10502.0", path = "vendor/duckdb", features = ["chrono", "vtab-arrow", "vscalar", "vscalar-arrow"], optional = true }
md-5 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
jsonschema = { version = "0.33", default-features = false }
rand = "0.9"
thiserror = "2"
unicode-segmentation = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
rdkafka = { version = "0.39", features = ["ssl-vendored", "sasl"], optional = true }

# Cross-built Linux clients cannot use the build host's Cyrus SASL/Kerberos.
[target.'cfg(target_os = "linux")'.dependencies]
rdkafka = { version = "0.39", features = ["gssapi-vendored"], optional = true }

[dev-dependencies]
# Independent scalar-expression oracle; no DataFusion physical query executor.
datafusion-physical-expr = { version = "53.1.0", default-features = false }

[[example]]
name = "trino_sql_plans"
path = "tools/diagnostics/trino_sql_plans.rs"

[[example]]
name = "collection_table_plans"
path = "tools/diagnostics/collection_table_plans.rs"

[[example]]
name = "cypher_corpus_probe"
path = "tools/diagnostics/cypher_corpus_probe.rs"

[[example]]
name = "cypher_dbg"
path = "tools/diagnostics/cypher_dbg.rs"

[[example]]
name = "language_functions_bench"
path = "tools/diagnostics/language_functions_bench.rs"
required-features = ["duckdb"]

[[example]]
name = "dependent_execution_bench"
path = "tools/diagnostics/dependent_execution_bench.rs"
required-features = ["duckdb"]

[[example]]
name = "mapped_execution_plans"
path = "tools/diagnostics/mapped_execution_plans.rs"

[[example]]
name = "partition_layout_plans"
path = "tools/diagnostics/partition_layout_plans.rs"

[[example]]
name = "representation_plans"
path = "tools/diagnostics/representation_plans.rs"


[[example]]
name = "statistics_access_plans"
path = "tools/diagnostics/statistics_access_plans.rs"

[[example]]
name = "statistics_join_plans"
path = "tools/diagnostics/statistics_join_plans.rs"

[[example]]
name = "statistics_plans"
path = "tools/diagnostics/statistics_plans.rs"

[profile.release]
strip = "symbols"

[[example]]
name = "kafka_bench"
path = "tools/diagnostics/kafka_bench.rs"
required-features = ["kafka"]

[[example]]
name = "manufacturing_audit"
path = "tools/diagnostics/manufacturing_audit.rs"
required-features = ["duckdb"]

# Pinned driver fix: fallible Arrow streaming must not report late errors as EOF.
[patch.crates-io]
duckdb = { path = "vendor/duckdb" }
datafusion-functions = { path = "vendor/datafusion-functions" }
datafusion-functions-aggregate = { path = "vendor/datafusion-functions-aggregate" }
datafusion-functions-nested = { path = "vendor/datafusion-functions-nested" }
datafusion-sql = { path = "vendor/datafusion-sql" }
libduckdb-sys = { path = "vendor/libduckdb-sys" }
