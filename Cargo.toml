[package]
name = "new-graph"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[features]
default = ["duckdb"]
duckdb = ["dep:duckdb"]
postgres = ["dep:postgres"]

[dependencies]
antlr4rust = "0.5.2"
arrow = "58.2.0"
arrow-select = "58.2.0"
bigdecimal = "0.4"
datafusion = "53.1.0"
datafusion-sql = "53.1.0"
duckdb = { version = "1.10502.0", features = ["bundled"], optional = true }
md-5 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
postgres = { version = "0.19", optional = true }
regex = "1"
sha2 = "0.10"
thiserror = "2"
unicode-segmentation = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
