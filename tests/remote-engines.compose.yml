# Local integration fixtures only. No production data or external interfaces.
services:
  quickwit:
    image: quickwit/quickwit:0.9.0
    command: run
    environment:
      QW_DISABLE_TELEMETRY: "1"
    ports:
      - "127.0.0.1:17280:7280"
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 1536m
    ports:
      - "127.0.0.1:19200:9200"
